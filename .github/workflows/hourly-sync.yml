name: Hourly Google Rank Sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger protected Vercel SERP sync
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

        run: |
          set -euo pipefail

          BODY=$(mktemp)

          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/sync" || true)

          echo "HTTP status: $STATUS"
          echo "Response body:"
          cat "$BODY"
          echo

          if ! [[ "$STATUS" =~ ^2[0-9][0-9]$ ]]; then
            exit 1
          fi
