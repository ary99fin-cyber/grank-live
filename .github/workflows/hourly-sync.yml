name: Hourly Google Rank Sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected Vercel SERP sync
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "ERROR: GitHub secret VERCEL_APP_URL kosong."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "ERROR: GitHub secret CRON_SECRET kosong."
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE=$(curl --show-error --silent \
            --retry 1 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/sync")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat "$RESPONSE_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Sync gagal. Lihat error JSON di atas."
            exit 1
          fi
