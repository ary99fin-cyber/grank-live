name: Hourly Google Rank Sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected Vercel SERP sync
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 2 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/sync"
